services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: axes_crm
      POSTGRES_USER: axes
      POSTGRES_PASSWORD: axes
      # Restricted runtime role — see postgres-init/01-create-app-role.sh.
      # The API connects as this role, never as the POSTGRES_USER superuser,
      # so that Row-Level Security tenant policies are actually enforced
      # (superusers have BYPASSRLS by nature and silently ignore every policy).
      APP_DB_USER: ${APP_DB_USER:-axes_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD before starting the stack}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axes -d axes_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info
      # Superuser connection — schema owner, used only if migrations run
      # from inside this service. The running app never uses this one.
      DATABASE_URL: postgresql://axes:axes@postgres:5432/axes_crm
      # Restricted role the app actually connects as (no BYPASSRLS).
      APP_DATABASE_URL: postgresql://${APP_DB_USER:-axes_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD before starting the stack}@postgres:5432/axes_crm
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER}
      AUTH_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-900}
      AUTH_REFRESH_TTL_SECONDS: ${AUTH_REFRESH_TTL_SECONDS:-2592000}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
