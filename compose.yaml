services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: axes_crm
      POSTGRES_USER: axes
      POSTGRES_PASSWORD: axes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axes -d axes_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
