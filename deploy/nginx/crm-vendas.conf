# CRM-vendas — proxy reverso HTTP/HTTPS (Nginx)
#
# Modelo instalado por deploy/setup-servidor.sh em /etc/nginx/conf.d/crm-vendas.conf.
# Os marcadores __SERVER_NAMES__, __SSL_CERT__ e __SSL_KEY__ são substituídos
# na instalação. Não edite a cópia instalada: ajuste este modelo e rode o setup.
#
# Fluxo:  navegador ──https──▶ Nginx :443 ──▶ web  127.0.0.1:3000  (/)
#                                         └──▶ api  127.0.0.1:3001  (/api/)
# Front e API ficam na MESMA origem, então o navegador não faz chamadas
# cross-origin nem mistura http:// em página https://.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream crm_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream crm_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

# ---------- HTTP: apenas redireciona para HTTPS ----------
server {
    listen 80;
    server_name __SERVER_NAMES__;

    return 301 https://$host$request_uri;
}

# ---------- HTTPS ----------
server {
    # Nginx < 1.25.1 usa "listen 443 ssl http2;".
    # Nginx >= 1.25.1 aceita, com aviso; a forma nova é "listen 443 ssl;" + "http2 on;".
    listen 443 ssl http2;
    server_name __SERVER_NAMES__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:CRMSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 120s;

    # API NestJS (prefixo global /api/v1 preservado)
    location /api/ {
        proxy_pass http://crm_api;
    }

    # Front Next.js
    location / {
        proxy_pass http://crm_web;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
