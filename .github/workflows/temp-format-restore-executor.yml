name: Temporary restore test formatter

on:
  push:
    branches:
      - feat/restore-transactional-executor-20261014

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/restore-transactional-executor-20261014
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/data-management/restore-executor.integration.spec.ts
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/data-management/restore-executor.integration.spec.ts
          git commit -m "style(restore): apply pinned Prettier to executor RED test"
          git push origin HEAD:feat/restore-transactional-executor-20261014
