name: C4.2.1 legacy test compatibility

on:
  push:
    branches:
      - feat/c4-2-1-company-import

permissions:
  contents: write

jobs:
  modernize-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/c4-2-1-company-import
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axes/api prisma:generate
      - name: Modernize legacy security test fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          import_paths = [
              Path('apps/api/src/audit/audit-completeness.integration.spec.ts'),
              Path('apps/api/src/authorization/tenant-isolation-security.integration.spec.ts'),
              Path('apps/api/src/observability/advanced-audit.integration.spec.ts'),
          ]
          for path in import_paths:
              text = path.read_text()
              old = '../common/filters/api-error.filter'
              if old not in text:
                  raise SystemExit(f'missing legacy filter import in {path}')
              path.write_text(text.replace(old, '../errors/api-error.filter'))

          tenant = Path('apps/api/src/authorization/tenant-isolation-security.integration.spec.ts')
          text = tenant.read_text()
          text = text.replace('givenName: "Bob",', 'fullName: "Bob",')
          tenant.write_text(text)

          path = Path('apps/api/src/database/comprehensive-rls.integration.spec.ts')
          text = path.read_text()
          text = text.replace('givenName:', 'fullName:')

          replacements = {
              '''name: "Tag A",\n            color: "#FF0000",\n            createdBy: userA,\n            updatedBy: userA,''': '''name: "Tag A",\n            normalizedName: "tag a",''',
              '''name: "Tag B",\n            color: "#00FF00",\n            createdBy: userA,\n            updatedBy: userA,''': '''name: "Tag B",\n            normalizedName: "tag b",''',
              '''name: "Tag A",\n          color: "#FF0000",\n          createdBy: userA,\n          updatedBy: userA,''': '''name: "Tag A",\n          normalizedName: "tag a",''',
              '''label: "Phone Ext",\n            type: "TEXT",\n            targetType: "COMPANY",\n            createdBy: userA,\n            updatedBy: userA,''': '''scope: "COMPANY",\n            key: "phone_ext",\n            label: "Phone Ext",\n            type: "TEXT",''',
              '''label: "Website",\n            type: "URL",\n            targetType: "COMPANY",\n            createdBy: userA,\n            updatedBy: userA,''': '''scope: "COMPANY",\n            key: "website",\n            label: "Website",\n            type: "TEXT",''',
              '''label: "Phone",\n          type: "TEXT",\n          targetType: "COMPANY",\n          createdBy: userA,\n          updatedBy: userA,''': '''scope: "COMPANY",\n          key: "phone",\n          label: "Phone",\n          type: "TEXT",''',
              '''label: "Phone",\n          type: "TEXT",\n          targetType: "CONTACT",\n          createdBy: userA,\n          updatedBy: userA,''': '''scope: "CONTACT",\n          key: "phone",\n          label: "Phone",\n          type: "TEXT",''',
              '''type: "NOTE",\n            content: "Follow up next week",\n            authorUserId: userA,''': '''kind: "NOTE",\n            content: "Follow up next week",\n            occurredAt: new Date("2026-09-13T12:00:00.000Z"),\n            authorUserId: userA,''',
              '''type: "CALL",\n            content: "Discussed partnership",\n            authorUserId: userA,''': '''kind: "CALL_NOTE",\n            content: "Discussed partnership",\n            occurredAt: new Date("2026-09-13T13:00:00.000Z"),\n            authorUserId: userA,''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected legacy fixture pattern: {old[:40]!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - run: pnpm exec prettier --write apps/api/src/audit/audit-completeness.integration.spec.ts apps/api/src/authorization/tenant-isolation-security.integration.spec.ts apps/api/src/database/comprehensive-rls.integration.spec.ts apps/api/src/observability/advanced-audit.integration.spec.ts
      - name: Verify API TypeScript after fixture modernization
        run: pnpm --filter @axes/api lint
      - name: Commit test compatibility updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/audit/audit-completeness.integration.spec.ts \
            apps/api/src/authorization/tenant-isolation-security.integration.spec.ts \
            apps/api/src/database/comprehensive-rls.integration.spec.ts \
            apps/api/src/observability/advanced-audit.integration.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test(security): align legacy fixtures with current schema"
          git push origin HEAD:feat/c4-2-1-company-import
