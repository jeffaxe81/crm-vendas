name: C12 format repair
on:
  push:
    branches:
      - test/c12-post-merge-homologation
    paths:
      - .github/workflows/c12-format-repair.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/api/src/integrations/integrations.module.ts \
            apps/api/src/integrations/neo-communication-settings.controller.ts \
            apps/web/src/app/admin/integration-credentials-view.tsx \
            apps/web/src/app/admin/neo-communication-settings-view.tsx \
            apps/web/src/app/communication/communication-view.tsx \
            apps/web/src/app/communication/embedded-frame.test.tsx \
            apps/web/src/app/globals.css \
            apps/web/src/app/page-communication-navigation.test.tsx \
            apps/web/src/app/page.tsx \
            docs/integrations/neo-interact-iframe.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/integrations apps/web/src/app docs/integrations/neo-interact-iframe.md
          if ! git diff --cached --quiet; then
            git commit -m 'style(c12): format inherited PR108 files'
            git push origin HEAD:test/c12-post-merge-homologation
          fi
