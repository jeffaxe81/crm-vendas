name: Fix and format Cycle 2 relationships test once

on:
  push:
    branches:
      - cycle-2-crm-core
    paths:
      - .github/workflows/fix-format-cycle2-relationships-test-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cycle-2-crm-core
      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Fix cross-organization history fixture
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/api/src/relationships/relationships.integration.spec.ts';
          let source = fs.readFileSync(path, 'utf8');
          const before = `    await prisma.relationshipEntry.create({\n      data: {\n        organizationId: other.id,\n        authorUserId: user.id,\n        companyId: null,\n        contactId: null,\n        kind: \"OTHER\",\n        content: \"Registro de outra organização\",\n        occurredAt: new Date(\"2026-09-06T21:00:00-03:00\"),\n      },\n    });`;
          const after = `    const otherCompany = await prisma.company.create({\n      data: {\n        organizationId: other.id,\n        legalName: \"Empresa de Outra Organização\",\n        createdBy: user.id,\n        updatedBy: user.id,\n      },\n    });\n\n    await prisma.relationshipEntry.create({\n      data: {\n        organizationId: other.id,\n        authorUserId: user.id,\n        companyId: otherCompany.id,\n        kind: \"OTHER\",\n        content: \"Registro de outra organização\",\n        occurredAt: new Date(\"2026-09-06T21:00:00-03:00\"),\n      },\n    });`;
          if (!source.includes(before)) throw new Error('Expected fixture block not found');
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
      - name: Format relationships test
        run: pnpm exec prettier --write apps/api/src/relationships/relationships.integration.spec.ts
      - name: Commit test-only correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/relationships/relationships.integration.spec.ts
          git diff --cached --quiet || git commit -m "test(api): fix relationship history isolation fixture"
          git push origin HEAD:cycle-2-crm-core
