name: C6 risk formatter
on:
  push:
    branches: [feat/c6-03-risk-signals]
    paths: [.github/workflows/c6-03-format-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec prettier --write apps/api/src/reports/commercial-risk.ts apps/api/src/reports/commercial-risk.spec.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/reports/commercial-risk.ts apps/api/src/reports/commercial-risk.spec.ts
          git diff --cached --quiet || (git commit -m 'style(c6): format risk signal modules' && git push origin HEAD:feat/c6-03-risk-signals)
