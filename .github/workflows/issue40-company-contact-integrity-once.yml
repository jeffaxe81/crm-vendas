name: Issue 40 company-contact integrity once

on:
  push:
    branches:
      - qa/issue-40-security-rls
    paths:
      - .github/workflows/issue40-company-contact-integrity-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: qa/issue-40-security-rls
          fetch-depth: 0
      - name: Patch schema and migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema = Path('apps/api/prisma/schema.prisma')
          text = schema.read_text()
          old_company = '  company           Company      @relation(fields: [companyId], references: [id], onDelete: Restrict)'
          new_company = '  company           Company      @relation(fields: [companyId, organizationId], references: [id, organizationId], onDelete: Restrict)'
          old_contact = '  contact           Contact      @relation(fields: [contactId], references: [id], onDelete: Restrict)'
          new_contact = '  contact           Contact      @relation(fields: [contactId, organizationId], references: [id, organizationId], onDelete: Restrict)'
          if text.count(old_company) != 1 or text.count(old_contact) != 1:
              raise SystemExit('Expected CompanyContact relation signatures not found exactly once')
          text = text.replace(old_company, new_company).replace(old_contact, new_contact)
          schema.write_text(text)

          migration = Path('apps/api/prisma/migrations/20260914062000_issue40_company_contact_tenant_integrity/migration.sql')
          migration.parent.mkdir(parents=True, exist_ok=False)
          migration.write_text('''-- Issue #40: enforce tenant-aware referential integrity for company-contact links.\n-- Existing inconsistent rows intentionally make this migration fail instead of being rewritten silently.\n\nALTER TABLE "company_contacts"\n  DROP CONSTRAINT IF EXISTS "company_contacts_company_id_fkey",\n  DROP CONSTRAINT IF EXISTS "company_contacts_contact_id_fkey";\n\nALTER TABLE "company_contacts"\n  ADD CONSTRAINT "company_contacts_company_org_fkey"\n  FOREIGN KEY ("company_id", "organization_id")\n  REFERENCES "companies"("id", "organization_id")\n  ON DELETE RESTRICT ON UPDATE CASCADE,\n  ADD CONSTRAINT "company_contacts_contact_org_fkey"\n  FOREIGN KEY ("contact_id", "organization_id")\n  REFERENCES "contacts"("id", "organization_id")\n  ON DELETE RESTRICT ON UPDATE CASCADE;\n''')
          PY
          rm .github/workflows/issue40-company-contact-integrity-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/prisma/schema.prisma apps/api/prisma/migrations/20260914062000_issue40_company_contact_tenant_integrity/migration.sql .github/workflows/issue40-company-contact-integrity-once.yml
          git commit -m "fix(security): enforce tenant-aware company-contact integrity"
          git push origin HEAD:qa/issue-40-security-rls
