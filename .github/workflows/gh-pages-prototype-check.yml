name: Validate static CRM prototype

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v4
      - name: Check static assets
        run: |
          test -s index.html
          test -s assets/site.css
          test -s assets/app.js
          node --check assets/app.js
          grep -Fq './assets/site.css' index.html
          grep -Fq './assets/app.js' index.html
      - name: Confirm no production API calls are present
        run: |
          if grep -En 'fetch\\(|XMLHttpRequest|NEXT_PUBLIC_API_BASE_URL' assets/app.js; then
            echo "This prototype must remain standalone."
            exit 1
          fi
