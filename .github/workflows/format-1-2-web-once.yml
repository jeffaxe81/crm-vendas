name: Format CRM 1.2 web once

on:
  push:
    branches:
      - release-1.2-configuracao-rapida-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release-1.2-configuracao-rapida-v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: >
          pnpm exec prettier --write
          apps/web/src/app/crm-shell.test.tsx
          apps/web/src/app/workspace/quick-setup-experience.test.tsx
          apps/web/src/app/workspace/quick-setup-experience.tsx
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/web/src/app/crm-shell.test.tsx             apps/web/src/app/workspace/quick-setup-experience.test.tsx             apps/web/src/app/workspace/quick-setup-experience.tsx
          git commit -m "style(1.2): format quick setup web"
          git push origin HEAD:release-1.2-configuracao-rapida-v2
