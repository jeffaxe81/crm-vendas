name: Temporary F4.3-04A formatter diagnostic
on:
  push:
    branches:
      - feat/f4-3-04a-provider-chooser-20261011
permissions:
  contents: read
jobs:
  print-prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Print exact proposed formatter changes
        run: |
          pnpm exec prettier --write apps/api/src/messaging/email/email-provider-preference.integration.spec.ts apps/api/src/messaging/email/email-provider-preference.service.ts apps/web/src/app/admin/email-provider-preference-panel.test.tsx apps/web/src/app/admin/email-provider-preference-panel.tsx
          git --no-pager diff -- apps/api/src/messaging/email/email-provider-preference.integration.spec.ts apps/api/src/messaging/email/email-provider-preference.service.ts apps/web/src/app/admin/email-provider-preference-panel.test.tsx apps/web/src/app/admin/email-provider-preference-panel.tsx
