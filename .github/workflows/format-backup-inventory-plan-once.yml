name: Format backup inventory plan once

on:
  push:
    branches:
      - feat/backup-orphan-inventory-20261024
    paths:
      - .github/workflows/format-backup-inventory-plan-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/backup-orphan-inventory-20261024
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/superpowers/plans/2026-10-24-backup-global-orphan-inventory.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-10-24-backup-global-orphan-inventory.md
          git commit -m "style(backup): format orphan inventory plan"
          git push origin HEAD:feat/backup-orphan-inventory-20261024
