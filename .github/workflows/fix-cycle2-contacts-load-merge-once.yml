name: Fix Cycle 2 contacts load merge once

on:
  push:
    branches:
      - cycle-2-crm-core
    paths:
      - .github/workflows/fix-cycle2-contacts-load-merge-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cycle-2-crm-core
      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Preserve mutations during initial contact load
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/app/contacts/contacts-view.tsx')
          text = path.read_text()
          old = '''        if (active) {\n          setContacts(contactResult.items);\n          setCompanies(companyResult.items);\n        }'''
          new = '''        if (active) {\n          setContacts(current => {\n            const loadedIds = new Set(contactResult.items.map(contact => contact.id));\n            return [\n              ...contactResult.items,\n              ...current.filter(contact => !loadedIds.has(contact.id)),\n            ];\n          });\n          setCompanies(companyResult.items);\n        }'''
          if text.count(old) != 1:
              raise SystemExit('expected initial state assignment exactly once')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write apps/web/src/app/contacts/contacts-view.tsx
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/contacts/contacts-view.tsx
          git diff --cached --quiet || git commit -m "fix(web): preserve contacts created during initial load"
          git push origin HEAD:cycle-2-crm-core
