name: C5 E2E formatting preview

on:
  pull_request:
    paths:
      - ".github/workflows/c5-e2e-format.yml"
      - "tests/e2e/knowledge-hub.spec.ts"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Preview exact formatting
        run: |
          pnpm exec prettier --write tests/e2e/knowledge-hub.spec.ts
          git diff --no-color -- tests/e2e/knowledge-hub.spec.ts
