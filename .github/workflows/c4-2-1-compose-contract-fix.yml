name: C4.2.1 compose contract repair

on:
  push:
    branches:
      - feat/c4-2-1-company-import

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/c4-2-1-company-import
      - name: Use documented example environment for compose contract checks
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/container-contract.test.mjs')
          test_text = test_path.read_text()
          old = '["compose", "config", "--format", "json"]'
          new = '["compose", "--env-file", ".env.example", "config", "--format", "json"]'
          if old not in test_text:
              raise SystemExit('container contract command pattern not found')
          test_path.write_text(test_text.replace(old, new))

          ci_path = Path('.github/workflows/ci.yml')
          ci_text = ci_path.read_text()
          old_config = 'run: docker compose config --quiet'
          new_config = 'run: docker compose --env-file .env.example config --quiet'
          old_build = 'run: docker compose build api web'
          new_build = 'run: docker compose --env-file .env.example build api web'
          if old_config not in ci_text or old_build not in ci_text:
              raise SystemExit('CI compose command pattern not found')
          ci_text = ci_text.replace(old_config, new_config).replace(old_build, new_build)
          ci_path.write_text(ci_text)
          PY
      - name: Verify compose contract
        run: node --test tests/container-contract.test.mjs
      - name: Verify compose config
        run: docker compose --env-file .env.example config --quiet
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/container-contract.test.mjs .github/workflows/ci.yml
          git commit -m "test(container): use documented compose environment"
          git push origin HEAD:feat/c4-2-1-company-import
