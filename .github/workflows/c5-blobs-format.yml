name: C5 blobs formatting preview

on:
  pull_request:
    paths:
      - ".github/workflows/c5-blobs-format.yml"
      - "apps/api/src/data-management/**"
      - "apps/api/src/knowledge/**"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Print exact source patch
        run: |
          pnpm exec prettier --write apps/api/src/data-management/backup-manifest.ts apps/api/src/data-management/knowledge-backup-objects.ts apps/api/src/data-management/knowledge-backup-objects.spec.ts apps/api/src/data-management/backup.service.ts apps/api/src/data-management/backup.integration.spec.ts apps/api/src/data-management/tenant-snapshot.ts apps/api/src/data-management/data-preview.service.ts apps/api/src/data-management/restore-executor.ts apps/api/src/data-management/restore-transaction.ts apps/api/src/data-management/restore-preventive-copy.ts apps/api/src/data-management/restore-locked-preflight.ts apps/api/src/data-management/recovery-deletion-preflight.ts apps/api/src/knowledge/local-knowledge-storage.ts
          git diff --no-color -- apps/api/src/data-management apps/api/src/knowledge
