name: Temporary RC formatting diagnostic
on:
  pull_request: {}
permissions:
  contents: read
jobs:
  exact-prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          pnpm install --frozen-lockfile
      - name: Show exact formatting diff (diagnostic only)
        run: |
          pnpm exec prettier --write tests/release-preflight-failclosed.test.mjs
          git diff -- tests/release-preflight-failclosed.test.mjs
