name: Format contact editing test once

on:
  push:
    branches:
      - feat/contact-editing-20261029
    paths:
      - apps/web/src/app/contacts/contact-editing.test.tsx
      - .github/workflows/format-contact-editing-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/contact-editing-20261029
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/app/contacts/contact-editing.test.tsx
      - name: Commit formatter result
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/contacts/contact-editing.test.tsx
          git commit -m "style(contacts): apply project Prettier"
          git push
