name: Diagnostic C3.6.2 boundary Prettier

on:
  push:
    branches:
      - diag/c3-6-2-boundaries-red-20260910

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/opportunities/opportunities-boundaries.integration.spec.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/opportunities/opportunities-boundaries.integration.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format C3.6.2 boundary tests"
          git push
