name: Diagnostic C3.6.2 update Prettier

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/src/opportunities/opportunities.service.ts"
      - ".github/workflows/diag-c3-6-2-update-prettier.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/opportunities/opportunities.service.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/opportunities/opportunities.service.ts
          git commit -m "style: format C3.6.2 optimistic update"
          git push
