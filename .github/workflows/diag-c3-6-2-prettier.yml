name: Diagnostic C3.6.2 plan Prettier

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-plan:
    if: github.event.pull_request.head.ref == 'diag/c3-6-2-contract-red-20260910'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/superpowers/plans/2026-09-10-c3-6-2-opportunity-api.md
      - name: Persist formatted plan
        run: |
          if git diff --quiet -- docs/superpowers/plans/2026-09-10-c3-6-2-opportunity-api.md; then
            echo "Plan already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-10-c3-6-2-opportunity-api.md
          git commit -m "style: format C3.6.2 implementation plan"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
