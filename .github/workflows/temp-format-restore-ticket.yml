name: Format restore executor once

on:
  push:
    branches:
      - feat/restore-ticket-event-internal-20261022
    paths:
      - .github/workflows/temp-format-restore-ticket.yml
      - apps/api/src/data-management/restore-executor.integration.spec.ts

permissions:
  contents: write

jobs:
  format:
    if: startsWith(github.event.head_commit.message, 'chore(ci): format restore executor once')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/restore-ticket-event-internal-20261022
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/data-management/restore-executor.integration.spec.ts
      - name: Commit formatter result
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/data-management/restore-executor.integration.spec.ts
          git commit -m "style(restore): apply prettier"
          git push origin HEAD:feat/restore-ticket-event-internal-20261022
