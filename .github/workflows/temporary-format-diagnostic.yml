name: Temporary formatting diagnostic
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  format-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          pnpm install --frozen-lockfile
      - name: Show formatter differences without committing
        run: |
          pnpm exec prettier --write apps/api/src/messaging/email/inbound-message-quarantine.integration.spec.ts
          git diff -- apps/api/src/messaging/email/inbound-message-quarantine.integration.spec.ts
