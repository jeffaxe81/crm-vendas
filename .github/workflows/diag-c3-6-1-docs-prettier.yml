name: Diagnostic C3.6.1 docs Prettier

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Generate exact Prettier output
        run: |
          pnpm exec prettier --write \
            docs/superpowers/plans/2026-09-10-c3-6-1-opportunity-foundation.md \
            docs/superpowers/specs/2026-09-10-c3-6-1-opportunity-foundation-design.md
          pnpm exec prettier --check \
            docs/superpowers/plans/2026-09-10-c3-6-1-opportunity-foundation.md \
            docs/superpowers/specs/2026-09-10-c3-6-1-opportunity-foundation-design.md
      - name: Commit exact formatted docs on diagnostic branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/superpowers/plans/2026-09-10-c3-6-1-opportunity-foundation.md \
            docs/superpowers/specs/2026-09-10-c3-6-1-opportunity-foundation-design.md
          if ! git diff --cached --quiet; then
            git commit -m "style: format C3.6.1 docs with repository Prettier"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
