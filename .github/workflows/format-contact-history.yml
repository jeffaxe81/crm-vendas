name: Format contact history once

on:
  push:
    branches:
      - cycle-2-crm-core
    paths:
      - .github/workflows/format-contact-history.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cycle-2-crm-core
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Format ContactsView and self-remove
        run: |
          pnpm exec prettier --write apps/web/src/app/contacts/contacts-view.tsx
          rm .github/workflows/format-contact-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/contacts/contacts-view.tsx .github/workflows/format-contact-history.yml
          git commit -m "style(web): format persisted contact history hydration"
          git push origin HEAD:cycle-2-crm-core
