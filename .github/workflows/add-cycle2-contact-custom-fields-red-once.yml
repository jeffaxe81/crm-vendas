name: Add Cycle 2 contact custom fields RED once

on:
  push:
    branches:
      - cycle-2-crm-core

permissions:
  contents: write

jobs:
  add-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cycle-2-crm-core
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Insert focused RED test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/app/contacts/contacts-view.test.tsx')
          text = path.read_text()
          marker = '  it("renders accessible controls for every supported custom field type", () => {'
          block = r'''  it("loads and saves persisted custom fields for a contact", async () => {
            const definition = {
              id: "81000000-0000-4000-8000-000000000005",
              organizationId,
              scope: "CONTACT",
              key: "segment",
              label: "Segmento",
              type: "SELECT",
              isRequired: false,
              options: ["A", "B"],
              isActive: true,
              createdAt: "2026-09-07T10:40:00.000Z",
              updatedAt: "2026-09-07T10:40:00.000Z",
            };
            const storedValue = {
              id: "82000000-0000-4000-8000-000000000001",
              organizationId,
              contactId: contact.id,
              definitionId: definition.id,
              value: "A",
              createdAt: "2026-09-07T10:41:00.000Z",
              updatedAt: "2026-09-07T10:41:00.000Z",
              definition,
            };

            const fetchMock = vi
              .fn()
              .mockResolvedValueOnce(
                response({ items: [contact], page: 1, limit: 20, total: 1 })
              )
              .mockResolvedValueOnce(
                response({ items: [company], page: 1, limit: 100, total: 1 })
              )
              .mockResolvedValueOnce(response([definition]))
              .mockResolvedValueOnce(response([storedValue]))
              .mockResolvedValueOnce(response({ ...storedValue, value: "B" }));
            vi.stubGlobal("fetch", fetchMock);

            render(<ContactsView accessToken={accessToken} />);

            const contactCard = (await screen.findByText("Ana Silva")).closest(
              "article"
            );
            expect(contactCard).not.toBeNull();

            fireEvent.click(
              within(contactCard as HTMLElement).getByRole("button", {
                name: "Campos customizados",
              })
            );

            const editor = await screen.findByLabelText(
              "Campos customizados do contato Ana Silva"
            );
            expect(within(editor).getByLabelText("Segmento")).toHaveValue("A");
            fireEvent.change(within(editor).getByLabelText("Segmento"), {
              target: { value: "B" },
            });
            fireEvent.click(
              within(editor).getByRole("button", {
                name: "Salvar campos customizados",
              })
            );

            await waitFor(() => {
              expect(fetchMock).toHaveBeenNthCalledWith(
                3,
                expect.stringContaining("/custom-fields?scope=CONTACT"),
                expect.objectContaining({
                  headers: expect.objectContaining({
                    Authorization: `Bearer ${accessToken}`,
                  }),
                })
              );
              expect(fetchMock).toHaveBeenNthCalledWith(
                4,
                expect.stringContaining(`/contacts/${contact.id}/custom-fields`),
                expect.objectContaining({
                  headers: expect.objectContaining({
                    Authorization: `Bearer ${accessToken}`,
                  }),
                })
              );
              expect(fetchMock).toHaveBeenNthCalledWith(
                5,
                expect.stringContaining(
                  `/contacts/${contact.id}/custom-fields/${definition.id}`
                ),
                expect.objectContaining({
                  method: "PUT",
                  body: JSON.stringify({ value: "B" }),
                })
              );
            });
          });

'''
          if block in text:
              raise SystemExit('RED test already present')
          if marker not in text:
              raise SystemExit('marker not found')
          path.write_text(text.replace(marker, block + marker))
          PY
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          pnpm exec prettier --write apps/web/src/app/contacts/contacts-view.test.tsx
      - name: Commit RED test
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/contacts/contacts-view.test.tsx
          git commit -m "test(web): add failing contact custom fields persistence" || exit 0
          git push origin HEAD:cycle-2-crm-core
