name: Format Cycle 2 contact tags RED once

on:
  push:
    branches:
      - cycle-2-crm-core
    paths:
      - .github/workflows/format-cycle2-contact-tags-red-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cycle-2-crm-core
      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format focused test
        run: pnpm exec prettier --write apps/web/src/app/contacts/contacts-view.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/contacts/contacts-view.test.tsx
          git diff --cached --quiet || git commit -m "style(web): format contact tag integration test"
          git push origin HEAD:cycle-2-crm-core
