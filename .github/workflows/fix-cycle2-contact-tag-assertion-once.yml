name: Fix Cycle 2 contact tag assertion once

on:
  push:
    branches:
      - cycle-2-crm-core
    paths:
      - .github/workflows/fix-cycle2-contact-tag-assertion-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cycle-2-crm-core
      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Make linked-tag assertion state-specific
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/app/contacts/contacts-view.test.tsx')
          text = path.read_text()
          old = '''    expect(\n      await within(tagEditor).findByText("Cliente VIP")\n    ).toBeInTheDocument();'''
          new = '''    expect(\n      await within(tagEditor).findByRole("button", {\n        name: "Remover tag Cliente VIP",\n      })\n    ).toBeInTheDocument();'''
          if text.count(old) != 1:
              raise SystemExit('expected generic tag assertion exactly once')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write apps/web/src/app/contacts/contacts-view.test.tsx
      - name: Commit test assertion fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/contacts/contacts-view.test.tsx
          git diff --cached --quiet || git commit -m "test(web): wait for linked contact tag state"
          git push origin HEAD:cycle-2-crm-core
