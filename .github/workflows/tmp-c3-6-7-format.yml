name: Temporary C3.6.7 formatter

on:
  push:
    branches:
      - feat/c3-6-7-opportunities-kanban

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/c3-6-7-opportunities-kanban
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: >
          pnpm exec prettier --write
          apps/api/src/webhooks/webhook-delivery-policy.ts
          apps/web/src/app/opportunities/opportunities-kanban.test.tsx
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/webhooks/webhook-delivery-policy.ts apps/web/src/app/opportunities/opportunities-kanban.test.tsx
          git commit -m "style: apply pinned Prettier for C3.6.7"
          git push
