name: Temporary C4 docs formatter

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0

      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format approved C4.1.1 docs
        run: |
          pnpm exec prettier --write docs/superpowers/specs/2026-09-12-c4-1-1-management-summary-design.md docs/superpowers/plans/2026-09-12-c4-1-1-management-summary.md
          git diff -- docs/superpowers/specs/2026-09-12-c4-1-1-management-summary-design.md docs/superpowers/plans/2026-09-12-c4-1-1-management-summary.md
