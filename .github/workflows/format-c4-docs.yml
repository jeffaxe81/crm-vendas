name: Temporary C4 docs formatter

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/c4-1-1-management-summary

      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0

      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and commit approved C4.1.1 docs
        run: |
          pnpm exec prettier --write docs/superpowers/specs/2026-09-12-c4-1-1-management-summary-design.md docs/superpowers/plans/2026-09-12-c4-1-1-management-summary.md
          if git diff --quiet -- docs/superpowers/specs/2026-09-12-c4-1-1-management-summary-design.md docs/superpowers/plans/2026-09-12-c4-1-1-management-summary.md; then
            echo "Documents already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/specs/2026-09-12-c4-1-1-management-summary-design.md docs/superpowers/plans/2026-09-12-c4-1-1-management-summary.md
          git commit -m "style(docs): format C4.1.1 design and plan"
          git push origin HEAD:feat/c4-1-1-management-summary
