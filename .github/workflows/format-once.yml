name: Format once

on:
  push:
    branches:
      - feat/email-oauth-homologation-preflight-20261029

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-once]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/email-oauth-homologation-preflight-20261029
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "apps/api/src/messaging/email/email-oauth-homologation-preflight.ts"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/api/src/messaging/email/email-oauth-homologation-preflight.ts"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format green candidate [format-once]"
          git push origin HEAD:feat/email-oauth-homologation-preflight-20261029
