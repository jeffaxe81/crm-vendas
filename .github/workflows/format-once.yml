name: Format once

on:
  push:
    branches:
      - qa/dashboard-concurrency-peak-20261029

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[format-once]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: qa/dashboard-concurrency-peak-20261029
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "docs/superpowers/plans/2026-10-29-dashboard-concurrency-evidence.md" "docs/superpowers/specs/2026-10-29-dashboard-concurrency-evidence-design.md" "tests/dashboard-staging-concurrency.test.mjs"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/superpowers/plans/2026-10-29-dashboard-concurrency-evidence.md" "docs/superpowers/specs/2026-10-29-dashboard-concurrency-evidence-design.md" "tests/dashboard-staging-concurrency.test.mjs"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format six-front red files [format-once]"
          git push origin HEAD:qa/dashboard-concurrency-peak-20261029
