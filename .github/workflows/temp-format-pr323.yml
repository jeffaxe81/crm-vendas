name: Temporary formatter
on:
  push:
    branches:
      - feat/email-oauth-homologation-preflight-20261029
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/email-oauth-homologation-preflight-20261029
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/messaging/email/email-oauth-homologation-preflight.ts
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/messaging/email/email-oauth-homologation-preflight.ts
          git rm .github/workflows/temp-format-pr323.yml
          git commit -m "style: aplicar Prettier no arquivo bloqueante"
          git push origin HEAD:feat/email-oauth-homologation-preflight-20261029
