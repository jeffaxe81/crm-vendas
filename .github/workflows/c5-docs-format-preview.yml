name: C5 docs formatter preview

on:
  pull_request:
    paths:
      - ".github/workflows/c5-docs-format-preview.yml"
      - "docs/testing/c5-massive-homologation.md"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Exact prettier diff
        run: |
          pnpm exec prettier --write docs/testing/c5-massive-homologation.md
          git diff --no-color -- docs/testing/c5-massive-homologation.md
