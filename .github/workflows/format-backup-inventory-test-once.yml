name: Format backup inventory test once

on:
  push:
    branches:
      - feat/backup-orphan-inventory-20261024
    paths:
      - .github/workflows/format-backup-inventory-test-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/backup-orphan-inventory-20261024
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/data-management/backup-storage-inventory.integration.spec.ts
      - run: |
          if git diff --quiet -- apps/api/src/data-management/backup-storage-inventory.integration.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/data-management/backup-storage-inventory.integration.spec.ts
          git commit -m "style(backup): format storage inventory test"
          git push origin HEAD:feat/backup-orphan-inventory-20261024
