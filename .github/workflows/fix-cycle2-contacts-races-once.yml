name: Fix Cycle 2 contacts races once

on:
  push:
    branches:
      - cycle-2-crm-core
    paths:
      - .github/workflows/fix-cycle2-contacts-races-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cycle-2-crm-core
      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply focused contacts fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/app/contacts/contacts-view.tsx')
          text = path.read_text()
          old = '''        const contactResult = await apiRequest<ListResponse<ContactRecord>>(\n          "/contacts?page=1&limit=20",\n          { accessToken }\n        );\n        const companyResult = await apiRequest<ListResponse<CompanyRecord>>(\n          "/companies?page=1&limit=100",\n          { accessToken }\n        );'''
          new = '''        const [contactResult, companyResult] = await Promise.all([\n          apiRequest<ListResponse<ContactRecord>>(\n            "/contacts?page=1&limit=20",\n            { accessToken }\n          ),\n          apiRequest<ListResponse<CompanyRecord>>(\n            "/companies?page=1&limit=100",\n            { accessToken }\n          ),\n        ]);'''
          if text.count(old) != 1:
              raise SystemExit('expected initial-load block exactly once')
          text = text.replace(old, new)
          old_close = '''      setHistory(current => [...current, created]);\n      setHistoryContactId(null);\n      setHistoryKind("NOTE");\n      setHistoryContent("");'''
          new_close = '''      setHistory(current => [...current, created]);\n      setHistoryKind("NOTE");\n      setHistoryContent("");'''
          if text.count(old_close) != 1:
              raise SystemExit('expected history reset block exactly once')
          text = text.replace(old_close, new_close)
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/app/contacts/contacts-view.tsx
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/contacts/contacts-view.tsx
          git diff --cached --quiet || git commit -m "fix(web): stabilize contacts workspace interactions"
          git push origin HEAD:cycle-2-crm-core
