name: Diagnostic C3.6.2 boundary test fix

on:
  push:
    branches:
      - diag/c3-6-2-boundaries-red-20260910

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Fix test helper return type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/opportunities/opportunities-boundaries.integration.spec.ts')
          text = path.read_text()
          old = '  async function createOpportunity(\n'
          new = '  function createOpportunity(\n'
          if old not in text:
              raise SystemExit('expected helper signature not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit test-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/opportunities/opportunities-boundaries.integration.spec.ts
          git commit -m "test: fix Task 5 supertest helper return type"
          git push
