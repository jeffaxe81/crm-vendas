name: Diagnostic C3.6.2 Task 5 RLS test fix

on:
  push:
    branches:
      - diag/c3-6-2-boundaries-green-20260910

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Make deleted-row verification tenant-aware
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/api/src/opportunities/opportunities-boundaries.integration.spec.ts')
          text = path.read_text()
          pattern = re.compile(
              r'    const deleted = await prisma\.\$queryRaw<.*?expect\(deleted\[0\]\?\.version\)\.toBe\(2\);',
              re.S,
          )
          replacement = '''    const deleted = await prisma.withTenant(
              fixture.organization.id,
              tenant =>
                tenant.opportunity.findFirst({
                  where: {
                    id: opportunityId,
                    organizationId: fixture.organization.id,
                  },
                  select: { deletedAt: true, deletedBy: true, version: true },
                })
            );
            expect(deleted?.deletedAt).toBeInstanceOf(Date);
            expect(deleted?.deletedBy).toBe(fixture.admin.id);
            expect(deleted?.version).toBe(2);'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one raw deleted-row verification block, found {count}')
          path.write_text(updated)
          PY
      - run: pnpm exec prettier --write apps/api/src/opportunities/opportunities-boundaries.integration.spec.ts
      - name: Commit test-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/opportunities/opportunities-boundaries.integration.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: verify opportunity soft delete inside tenant context"
          git push
