name: Format PR 284 once

on:
  push:
    paths:
      - ".github/workflows/format-pr284-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/retention-protect-restore-references-20261022
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/data-management/backup-deletion.integration.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/data-management/backup-deletion.integration.spec.ts
          git commit -m "style(backup): format retention restore reference test"
          git push origin HEAD:fix/retention-protect-restore-references-20261022
