name: Format C12 backlog once

on:
  push:
    branches:
      - test/c12-deploy-real-evidence-gate-20261028
    paths:
      - docs/backlog-do-produto.md
      - .github/workflows/format-c12-backlog-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/c12-deploy-real-evidence-gate-20261028
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/backlog-do-produto.md
      - name: Commit formatter output
        run: |
          if git diff --quiet -- docs/backlog-do-produto.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backlog-do-produto.md
          git commit -m "style(c12): format backlog status"
          git push origin HEAD:test/c12-deploy-real-evidence-gate-20261028
