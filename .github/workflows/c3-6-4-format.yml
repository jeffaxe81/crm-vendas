name: C3.6.4 exact formatter

on:
  push:
    branches:
      - feat/c3-6-4-opportunities-web-list
    paths:
      - .github/workflows/c3-6-4-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/c3-6-4-opportunities-web-list
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply repository Prettier configuration
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/crm-shell.tsx \
            apps/web/src/app/opportunities/opportunities-view.tsx
          rm .github/workflows/c3-6-4-format.yml
      - name: Commit deterministic formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/crm-shell.tsx apps/web/src/app/opportunities/opportunities-view.tsx .github/workflows/c3-6-4-format.yml
          git commit -m "style(web): apply exact prettier output"
          git push origin HEAD:feat/c3-6-4-opportunities-web-list
