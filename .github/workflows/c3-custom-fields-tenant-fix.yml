name: C3 custom fields tenant fix

on:
  push:
    branches:
      - feat/c3-bottlecrm-engine-adoption
    paths:
      - .github/workflows/c3-custom-fields-tenant-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/c3-bottlecrm-engine-adoption
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply minimal tenant-context fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/api/src/custom-fields/custom-fields.service.ts')
          text = path.read_text()
          old = '''  private async requireCompany(id: string, organizationId: string) {
    const company = await this.prisma.company.findFirst({
      where: { id, organizationId, deletedAt: null },
    });

    if (!company) {
      throw new NotFoundException({
        code: "COMPANY_NOT_FOUND",
        message: "Empresa não encontrada.",
      });
    }

    return company;
  }
'''
          new = '''  private async requireCompany(id: string, organizationId: string) {
    return this.prisma.withTenant(organizationId, async tenant => {
      const company = await tenant.company.findFirst({
        where: { id, organizationId, deletedAt: null },
      });

      if (!company) {
        throw new NotFoundException({
          code: "COMPANY_NOT_FOUND",
          message: "Empresa não encontrada.",
        });
      }

      return company;
    });
  }
'''
          if old not in text:
              raise SystemExit('expected requireCompany block not found; refusing to edit')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write apps/api/src/custom-fields/custom-fields.service.ts
      - name: Commit production fix and remove temporary workflow
        run: |
          rm .github/workflows/c3-custom-fields-tenant-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/custom-fields/custom-fields.service.ts .github/workflows/c3-custom-fields-tenant-fix.yml
          git commit -m "feat(c3.3): scope custom field company checks to tenant context"
          git push origin HEAD:feat/c3-bottlecrm-engine-adoption
