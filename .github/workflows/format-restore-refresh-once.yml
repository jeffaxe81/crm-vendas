name: Format restore refresh test once

on:
  push:
    branches:
      - feat/restore-refresh-session-revoke-20261024

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/restore-refresh-session-revoke-20261024
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format target test
        run: pnpm exec prettier --write apps/api/src/data-management/restore-refresh-sessions.integration.spec.ts
      - name: Commit formatter result
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/data-management/restore-refresh-sessions.integration.spec.ts
          git commit -m "style(restore): apply repository Prettier"
          git push origin HEAD:feat/restore-refresh-session-revoke-20261024
