name: Add Cycle 2 contact tag unlink RED once

on:
  push:
    branches:
      - cycle-2-crm-core
    paths:
      - .github/workflows/add-cycle2-contact-tag-unlink-red-once.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cycle-2-crm-core
      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Extend tag test with unlink behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/app/contacts/contacts-view.test.tsx')
          text = path.read_text()
          text = text.replace(
            'it("links an available tag to a contact", async () => {',
            'it("links and unlinks an available tag on a contact", async () => {',
            1,
          )
          old_mock = '''          201\n        )\n      );'''
          new_mock = '''          201\n        )\n      )\n      .mockResolvedValueOnce(response(undefined, 204));'''
          if text.count(old_mock) != 1:
              raise SystemExit('expected tag link mock terminator exactly once')
          text = text.replace(old_mock, new_mock)
          old_end = '''    expect(fetchMock).toHaveBeenNthCalledWith(\n      4,\n      expect.stringContaining(`/contacts/${contact.id}/tags/${tag.id}`),\n      expect.objectContaining({ method: "POST" })\n    );\n  });'''
          new_end = '''    expect(fetchMock).toHaveBeenNthCalledWith(\n      4,\n      expect.stringContaining(`/contacts/${contact.id}/tags/${tag.id}`),\n      expect.objectContaining({ method: "POST" })\n    );\n\n    fireEvent.click(\n      within(tagEditor).getByRole("button", {\n        name: "Remover tag Cliente VIP",\n      })\n    );\n\n    expect(\n      await within(tagEditor).findByText("Nenhuma tag vinculada.")\n    ).toBeInTheDocument();\n    expect(fetchMock).toHaveBeenNthCalledWith(\n      5,\n      expect.stringContaining(`/contacts/${contact.id}/tags/${tag.id}`),\n      expect.objectContaining({ method: "DELETE" })\n    );\n  });'''
          if text.count(old_end) != 1:
              raise SystemExit('expected tag link assertion block exactly once')
          path.write_text(text.replace(old_end, new_end))
          PY
          pnpm exec prettier --write apps/web/src/app/contacts/contacts-view.test.tsx
      - name: Commit RED test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/contacts/contacts-view.test.tsx
          git diff --cached --quiet || git commit -m "test(web): require contact tag unlink behavior"
          git push origin HEAD:cycle-2-crm-core
