name: Cycle 1 quality gate

on:
  pull_request:
    branches:
      - cycle-0-foundation

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: axes_crm
          POSTGRES_USER: axes
          POSTGRES_PASSWORD: axes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axes -d axes_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3001
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://axes:axes@127.0.0.1:5432/axes_crm
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001/api/v1
      WEB_ORIGIN: http://127.0.0.1:3000
      JWT_ACCESS_SECRET: test-access-secret-with-at-least-32-characters
      REFRESH_TOKEN_PEPPER: test-refresh-pepper-with-at-least-32-characters
      AUTH_ACCESS_TTL_SECONDS: 900
      AUTH_REFRESH_TTL_SECONDS: 2592000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0

      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @axes/api prisma:generate

      - name: Deploy database migrations
        run: pnpm --filter @axes/api prisma:migrate:deploy

      - name: Verify source and tests
        run: pnpm verify

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end test
        run: pnpm test:e2e

      - name: Validate Compose contract
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build api web
