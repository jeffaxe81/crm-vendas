name: format-c3-loss-reason-once

on:
  push:
    branches:
      - feat/c3-loss-reason-completion-20261101

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/c3-loss-reason-completion-20261101
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/opportunities/opportunities.integration.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/opportunities/opportunities.integration.spec.ts
          git commit -m "style(c3): apply repository prettier"
          git push
