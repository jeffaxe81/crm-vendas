name: Fix workspace login status once
on:
  push:
    branches:
      - fix/workspace-login-status
    paths:
      - .github/workflows/fix-workspace-login-status-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/workspace-login-status
      - name: Align login expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("apps/api/src/workspace/workspace-preferences.integration.spec.ts")
          text = path.read_text()
          pattern = r'(\.post\("/api/v1/auth/login"\).*?\.expect\()201(\);)'
          updated, count = re.subn(pattern, r'\g<1>200\2', text, flags=re.S)
          if count != 2:
              raise SystemExit(f"expected 2 login assertions, changed {count}")
          path.write_text(updated)
          PY
      - name: Commit focused test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/workspace/workspace-preferences.integration.spec.ts
          git commit -m "fix(test): align workspace login expectations with auth contract"
          git push origin HEAD:fix/workspace-login-status
