name: Format backup worker once

on:
  push:
    branches:
      - feat/crm-backup-worker

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/crm-backup-worker
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/data-management/backup.service.ts apps/api/src/data-management/data-operation.worker.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/data-management/backup.service.ts apps/api/src/data-management/data-operation.worker.ts
          git commit -m "style(backup): apply project formatter"
          git push
