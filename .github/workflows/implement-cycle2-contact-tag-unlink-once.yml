name: Implement Cycle 2 contact tag unlink once

on:
  push:
    branches:
      - cycle-2-crm-core
    paths:
      - .github/workflows/implement-cycle2-contact-tag-unlink-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cycle-2-crm-core
      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Implement tested tag unlink path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/app/contacts/contacts-view.tsx')
          text = path.read_text()
          marker = '''  const taggedContact = tagContactId\n    ? contacts.find(contact => contact.id === tagContactId)\n    : undefined;'''
          addition = '''  async function unlinkTag(tagId: string) {\n    if (!tagContactId) {\n      return;\n    }\n\n    setError("");\n    try {\n      await apiRequest(`/contacts/${tagContactId}/tags/${tagId}`, {\n        accessToken,\n        method: "DELETE",\n      });\n      setLinkedTagIdsByContact(current => ({\n        ...current,\n        [tagContactId]: (current[tagContactId] ?? []).filter(\n          linkedTagId => linkedTagId !== tagId\n        ),\n      }));\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : "Não foi possível remover a tag."\n      );\n    }\n  }\n\n  const taggedContact = tagContactId\n    ? contacts.find(contact => contact.id === tagContactId)\n    : undefined;'''
          if text.count(marker) != 1:
              raise SystemExit('expected tagged contact marker exactly once')
          text = text.replace(marker, addition)
          old = '''            onLink={tagId => void linkTag(tagId)}\n            onUnlink={() => undefined}'''
          new = '''            onLink={tagId => void linkTag(tagId)}\n            onUnlink={tagId => void unlinkTag(tagId)}'''
          if text.count(old) != 1:
              raise SystemExit('expected tag editor callbacks exactly once')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write apps/web/src/app/contacts/contacts-view.tsx
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/contacts/contacts-view.tsx
          git diff --cached --quiet || git commit -m "feat(web): unlink tags from contact workspace"
          git push origin HEAD:cycle-2-crm-core
