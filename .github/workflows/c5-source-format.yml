name: C5 source formatting diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/c5-source-format.yml"
      - "apps/api/src/knowledge/**"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Exact source format patch
        run: |
          pnpm exec prettier --write apps/api/src/knowledge
          git diff --no-color -- apps/api/src/knowledge
