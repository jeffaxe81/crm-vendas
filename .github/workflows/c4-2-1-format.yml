name: C4.2.1 format changed files

on:
  push:
    branches:
      - feat/c4-2-1-company-import

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/c4-2-1-company-import
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format C4.2.1 files
        run: >-
          pnpm exec prettier --write
          apps/api/src/companies/companies.service.ts
          apps/api/src/company-imports/company-csv-parser.spec.ts
          apps/api/src/company-imports/company-import.integration.spec.ts
          apps/api/src/company-imports/company-import.service.spec.ts
          apps/web/src/app/companies/companies-view.tsx
          apps/web/src/app/companies/company-import-view.test.tsx
          apps/web/src/app/page.tsx
          docs/backlog-do-produto.md
          docs/roadmap.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/companies/companies.service.ts \
            apps/api/src/company-imports/company-csv-parser.spec.ts \
            apps/api/src/company-imports/company-import.integration.spec.ts \
            apps/api/src/company-imports/company-import.service.spec.ts \
            apps/web/src/app/companies/companies-view.tsx \
            apps/web/src/app/companies/company-import-view.test.tsx \
            apps/web/src/app/page.tsx \
            docs/backlog-do-produto.md \
            docs/roadmap.md
          git commit -m "style(c4.2.1): apply repository formatting"
          git push origin HEAD:feat/c4-2-1-company-import
