name: C4.2.1 format preexisting files

on:
  push:
    branches:
      - feat/c4-2-1-company-import

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/c4-2-1-company-import
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Format preexisting files
        run: >-
          pnpm exec prettier --write
          apps/api/src/audit/audit-completeness.integration.spec.ts
          apps/api/src/audit/audit.service.ts
          apps/api/src/audit/denied-access.logger.ts
          apps/api/src/custom-fields/custom-fields.service.ts
          apps/api/src/database/comprehensive-rls.integration.spec.ts
          apps/api/src/observability/advanced-audit.integration.spec.ts
          apps/api/src/observability/tenant-rate-limit.guard.ts
          apps/api/src/observability/tenant-rate-limit.service.ts
          apps/api/src/relationships/relationships.service.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/audit/audit-completeness.integration.spec.ts \
            apps/api/src/audit/audit.service.ts \
            apps/api/src/audit/denied-access.logger.ts \
            apps/api/src/custom-fields/custom-fields.service.ts \
            apps/api/src/database/comprehensive-rls.integration.spec.ts \
            apps/api/src/observability/advanced-audit.integration.spec.ts \
            apps/api/src/observability/tenant-rate-limit.guard.ts \
            apps/api/src/observability/tenant-rate-limit.service.ts \
            apps/api/src/relationships/relationships.service.ts
          git commit -m "style(repo): normalize preexisting formatting"
          git push origin HEAD:feat/c4-2-1-company-import
