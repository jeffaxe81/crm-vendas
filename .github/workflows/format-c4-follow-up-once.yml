name: Format C4 follow-up once

on:
  push:
    branches:
      - feat/c4-follow-up-completion-20261102

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/c4-follow-up-completion-20261102
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/superpowers/plans/2026-11-02-c4-follow-up-completion.md packages/contracts/src/activities.test.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-11-02-c4-follow-up-completion.md packages/contracts/src/activities.test.ts
          git commit -m "style(c4): format follow-up RED artifacts"
          git push origin HEAD:feat/c4-follow-up-completion-20261102
