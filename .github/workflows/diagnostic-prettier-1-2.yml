name: Diagnostic Prettier 1.2

on:
  push:
    branches:
      - release-1.2-configuracao-rapida-v2

permissions:
  contents: read

jobs:
  print:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier output
        run: pnpm exec prettier apps/api/src/workspace/quick-setup.integration.spec.ts
