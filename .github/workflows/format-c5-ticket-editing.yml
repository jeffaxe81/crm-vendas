name: Format C5 ticket editing regression once

on:
  push:
    branches:
      - fix/c5-ticket-editing
    paths:
      - .github/workflows/format-c5-ticket-editing.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/c5-ticket-editing
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/app/tickets/ticket-editing.test.tsx
      - name: Commit formatted test
        run: |
          if git diff --quiet -- apps/web/src/app/tickets/ticket-editing.test.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/tickets/ticket-editing.test.tsx
          git commit -m "style(web): format ticket editing regression"
          git push origin HEAD:fix/c5-ticket-editing
