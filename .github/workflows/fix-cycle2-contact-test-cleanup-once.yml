name: Fix Cycle 2 contact test cleanup once

on:
  push:
    branches:
      - cycle-2-crm-core
    paths:
      - .github/workflows/fix-cycle2-contact-test-cleanup-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cycle-2-crm-core
      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Add explicit testing-library cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/app/contacts/contacts-view.test.tsx')
          text = path.read_text()
          old_import = '''import {\n  fireEvent,\n  render,\n  screen,\n  waitFor,\n  within,\n} from "@testing-library/react";'''
          new_import = '''import {\n  cleanup,\n  fireEvent,\n  render,\n  screen,\n  waitFor,\n  within,\n} from "@testing-library/react";'''
          if text.count(old_import) != 1:
              raise SystemExit('expected testing-library import exactly once')
          text = text.replace(old_import, new_import)
          old_after = '''afterEach(() => {\n  vi.unstubAllGlobals();\n});'''
          new_after = '''afterEach(() => {\n  cleanup();\n  vi.unstubAllGlobals();\n});'''
          if text.count(old_after) != 1:
              raise SystemExit('expected afterEach block exactly once')
          path.write_text(text.replace(old_after, new_after))
          PY
          pnpm exec prettier --write apps/web/src/app/contacts/contacts-view.test.tsx
      - name: Commit test isolation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/contacts/contacts-view.test.tsx
          git diff --cached --quiet || git commit -m "test(web): isolate contact workspace renders"
          git push origin HEAD:cycle-2-crm-core
