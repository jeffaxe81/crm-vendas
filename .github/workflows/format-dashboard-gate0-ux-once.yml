name: Format dashboard Gate 0 UX once

on:
  push:
    branches:
      - qa/dashboard-ux-gate0-evidence-20261028

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: qa/dashboard-ux-gate0-evidence-20261028
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format targeted files
        run: pnpm exec prettier --write docs/superpowers/plans/2026-10-28-dashboard-gate0-ux-evidence.md tests/e2e/dashboard-gate0-ux.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-10-28-dashboard-gate0-ux-evidence.md tests/e2e/dashboard-gate0-ux.spec.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(qa): format dashboard Gate 0 evidence"
          git push origin HEAD:qa/dashboard-ux-gate0-evidence-20261028
