name: Format C3.6.4 once

on:
  push:
    branches:
      - feat/c3-6-4-opportunities-web-list

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/c3-6-4-opportunities-web-list
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply project Prettier
        run: |
          pnpm exec prettier --write \
            apps/web/src/app/crm-shell.tsx \
            apps/web/src/app/opportunities/opportunities-view.tsx
          rm .github/workflows/c3-6-4-format-once.yml
      - name: Commit formatted files and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style(web): format C3.6.4 opportunities list"
          git push origin HEAD:feat/c3-6-4-opportunities-web-list
