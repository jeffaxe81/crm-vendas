name: Implement Cycle 2 contact tag link once

on:
  push:
    branches:
      - cycle-2-crm-core
    paths:
      - .github/workflows/implement-cycle2-contact-tags-link-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cycle-2-crm-core
      - name: Configure Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - name: Configure pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Implement tested tag link path
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/app/contacts/contacts-view.tsx')
          text = path.read_text()

          old = '''import { apiRequest } from "../../lib/api-client";'''
          new = '''import { apiRequest } from "../../lib/api-client";\nimport { TagEditor, type TagEditorItem } from "../shared/tag-editor";'''
          if text.count(old) != 1:
              raise SystemExit('expected apiRequest import exactly once')
          text = text.replace(old, new)

          old = '''  const [historyKind, setHistoryKind] = useState<RelationshipEntryKind>("NOTE");\n  const [historyContent, setHistoryContent] = useState("");'''
          new = '''  const [historyKind, setHistoryKind] = useState<RelationshipEntryKind>("NOTE");\n  const [historyContent, setHistoryContent] = useState("");\n  const [tagContactId, setTagContactId] = useState<string | null>(null);\n  const [availableTags, setAvailableTags] = useState<TagEditorItem[]>([]);\n  const [linkedTagIdsByContact, setLinkedTagIdsByContact] = useState<\n    Record<string, string[]>\n  >({});'''
          if text.count(old) != 1:
              raise SystemExit('expected history state block exactly once')
          text = text.replace(old, new)

          marker = '''  return (\n    <section className="contacts-view" aria-labelledby="contacts-title">'''
          addition = '''  async function openTagEditor(contactId: string) {\n    setError("");\n\n    try {\n      const result = await apiRequest<ListResponse<TagEditorItem>>(\n        "/tags?page=1&limit=100",\n        { accessToken }\n      );\n      setAvailableTags(result.items);\n      setTagContactId(contactId);\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : "Não foi possível carregar as tags."\n      );\n    }\n  }\n\n  async function linkTag(tagId: string) {\n    if (!tagContactId) {\n      return;\n    }\n\n    setError("");\n    try {\n      await apiRequest(`/contacts/${tagContactId}/tags/${tagId}`, {\n        accessToken,\n        method: "POST",\n        body: {},\n      });\n      setLinkedTagIdsByContact(current => ({\n        ...current,\n        [tagContactId]: Array.from(\n          new Set([...(current[tagContactId] ?? []), tagId])\n        ),\n      }));\n    } catch (cause) {\n      setError(\n        cause instanceof Error\n          ? cause.message\n          : "Não foi possível vincular a tag."\n      );\n    }\n  }\n\n  const taggedContact = tagContactId\n    ? contacts.find(contact => contact.id === tagContactId)\n    : undefined;\n\n  return (\n    <section className="contacts-view" aria-labelledby="contacts-title">'''
          if text.count(marker) != 1:
              raise SystemExit('expected return marker exactly once')
          text = text.replace(marker, addition)

          old = '''              <button\n                type="button"\n                onClick={() => {\n                  setHistoryContactId(contact.id);\n                  setHistoryKind("NOTE");\n                  setHistoryContent("");\n                }}\n              >\n                Registrar histórico\n              </button>'''
          new = '''              <button\n                type="button"\n                onClick={() => {\n                  setHistoryContactId(contact.id);\n                  setHistoryKind("NOTE");\n                  setHistoryContent("");\n                }}\n              >\n                Registrar histórico\n              </button>\n              <button\n                type="button"\n                onClick={() => void openTagEditor(contact.id)}\n              >\n                Gerenciar tags\n              </button>'''
          if text.count(old) != 1:
              raise SystemExit('expected contact action block exactly once')
          text = text.replace(old, new)

          old = '''      </div>\n\n      {channelContactId ? ('''
          new = '''      </div>\n\n      {taggedContact ? (\n        <section\n          className="contact-tags"\n          aria-label={`Tags do contato ${taggedContact.fullName}`}\n        >\n          <TagEditor\n            availableTags={availableTags}\n            linkedTagIds={linkedTagIdsByContact[taggedContact.id] ?? []}\n            onLink={tagId => void linkTag(tagId)}\n            onUnlink={() => undefined}\n          />\n        </section>\n      ) : null}\n\n      {channelContactId ? ('''
          if text.count(old) != 1:
              raise SystemExit('expected post-grid marker exactly once')
          text = text.replace(old, new)

          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/app/contacts/contacts-view.tsx
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app/contacts/contacts-view.tsx
          git diff --cached --quiet || git commit -m "feat(web): link tags from contact workspace"
          git push origin HEAD:cycle-2-crm-core
