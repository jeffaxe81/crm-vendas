name: Diagnostic custom fields Prettier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Generate exact Prettier output
        run: pnpm exec prettier --write apps/api/src/custom-fields/custom-fields.integration.spec.ts
      - name: Capture formatted file
        uses: actions/upload-artifact@v4
        with:
          name: c3-custom-fields-prettier-formatted
          path: apps/api/src/custom-fields/custom-fields.integration.spec.ts
          if-no-files-found: error
